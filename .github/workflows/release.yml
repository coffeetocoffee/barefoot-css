name: Release

# Publish a new version to npm when a vX.Y.Z tag is pushed.
# Tag it with:  git tag v1.0.0 && git push origin v1.0.0
#
# Auth is OIDC trusted publishing — no NPM_TOKEN secret, nothing to
# rotate, nothing to leak. Prerequisite (one-time, on npmjs.com →
# package settings → Trusted Publisher): authorize GitHub Actions for
# this repo + this workflow file. The workflow side needs
# `id-token: write` (below) and npm ≥ 11.5.1 (Node 22 ships npm 10,
# hence the upgrade step); `npm publish` then mints a short-lived
# token itself. Do NOT set NODE_AUTH_TOKEN — a static token would take
# precedence and reintroduce the E403/2FA failure mode.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      # OIDC trusted publishing needs npm ≥ 11.5.1; Node 22 ships npm 10,
      # so upgrade first. Fail-fast bonus: if the npm upgrade or the
      # registry handshake breaks, it breaks here — before build+test.
      - name: Preflight — npm with OIDC trusted-publishing support
        run: |
          npm install -g npm@11
          npm --version

      - name: Install
        run: npm ci

      - name: Build + size budget
        run: npm run check

      - name: Playwright browser
        run: npx playwright install chromium --with-deps

      # Chromium only: this job installs just chromium. Running without
      # --project would also try firefox/webkit (not installed) and fail.
      - name: Tests (a11y + JS + CSS behavior)
        run: npx playwright test --project=chromium tests/a11y.spec.js tests/js.spec.js tests/css.spec.js

      # Prepublish runs npm run check again; skip audit since npm publishes
      # already-built dist. OIDC: no NODE_AUTH_TOKEN — trusted publishing
      # mints the token from the workflow's id-token at publish time.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
