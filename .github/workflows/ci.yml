name: CI

on:
  push:
  pull_request:

jobs:
  build-size:
    name: Build + size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        # npm run check = build + enforce the 10KB gzip budget on
        # dist/index.css (npm run size fails if exceeded).

  behavior:
    name: Behavior + a11y (axe-core, JS, CSS, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium tests/a11y.spec.js tests/js.spec.js tests/css.spec.js

  firefox:
    name: Behavior (JS + CSS, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run test:ff

  webkit:
    name: Behavior (JS + CSS, WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:webkit
        # WebKit = Safari's engine; run on macOS to match CI/OS real usage.

  visual:
    name: Visual regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
        # Baselines are font/OS-sensitive and committed as
        # *-win32.png. Run on Windows to match. Regenerate
        # deliberately with: npm run test:visual:update
