name: CI

on:
  push:
  pull_request:

jobs:
  build-size:
    name: Build + size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        # npm run check = build + enforce the 10KB gzip budget on
        # dist/index.css (npm run size fails if exceeded).

  packaging:
    name: Fresh-install smoke test (npm pack → install → import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the tarball, install it in a throwaway consumer, import it
        run: |
          npm pack >/dev/null 2>&1
          TARBALL="barefoot-css-$(node -p "require('./package.json').version").tgz"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null 2>&1
          npm install "$OLDPWD/$TARBALL" --silent >/dev/null 2>&1
          cat > smoke.mjs <<'EOF'
          import { existsSync } from "node:fs";
          const targets = [
            "barefoot-css",
            "barefoot-css/full.css",
            "barefoot-css/components/forms.css",
            "barefoot-css/components/table.css",
            "barefoot-css/themes/dashboard.css",
            "barefoot-css/utilities.css",
            "barefoot-css/js/barefoot.js",
            "barefoot-css/src/index.css",
          ];
          for (const t of targets) {
            const r = import.meta.resolve(t); // throws if the exports map rejects it
            if (!existsSync(new URL(r))) throw new Error(`${t} resolved to a missing file: ${r}`);
            console.log(`ok ${t} -> ${r.replace(process.cwd(), ".")}`);
          }
          EOF
          node smoke.mjs

  a11y:
    name: A11y (axe-core on every PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        # dist/ is gitignored — the demo page is unstyled until built.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium tests/a11y.spec.js
        # Every PR gets the full axe-core conformance suite (resting,
        # dark, contrast, dialog/dropdown/toast open) as its own check.

  behavior:
    name: Behavior (JS + CSS, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        # dist/ is gitignored, so the demo page is unstyled until it's
        # built — the test jobs must build before running Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium tests/js.spec.js tests/css.spec.js

  firefox:
    name: Behavior (JS + CSS, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps firefox
        # Behavior only — no visual.spec.js here. Baselines are
        # *-win32.png; on Linux Playwright would demand *-linux.png
        # snapshots that don't exist. Cross-engine visuals run in the
        # "visual-cross" Windows job below.
      - run: npx playwright test --project=firefox tests/css.spec.js tests/js.spec.js

  webkit:
    name: Behavior (JS + CSS, WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
        # WebKit = Safari's engine; run on macOS to match real usage.
        # Behavior only — no visual.spec.js (baselines are *-win32.png;
        # see the firefox job note).
      - run: npx playwright test --project=webkit tests/css.spec.js tests/js.spec.js

  visual:
    name: Visual regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:visual
        # Baselines are font/OS-sensitive and committed as
        # *-win32.png. Run on Windows to match. Regenerate
        # deliberately with: npm run test:visual:update

  visual-cross:
    name: Visual regression (Firefox + WebKit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install firefox webkit
        # The committed light/dark-firefox-win32.png and
        # light/dark-webkit-win32.png baselines must stay honest, so
        # cross-engine visuals need Windows too (workers=1 in CI keeps
        # the two suites from colliding on localhost:4173).
      - run: npx playwright test --project=firefox --project=webkit tests/visual.spec.js
