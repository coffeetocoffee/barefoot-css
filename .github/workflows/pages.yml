name: Deploy docs + demo to GitHub Pages

# Publishes the docs site (docs/) and conformance demo (demo/) to
# GitHub Pages, with the built dist/ alongside so both are styled.
# Site URL: https://coffeetocoffee.github.io/barefoot-css/
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage site (docs + demo + built dist)
        run: |
          mkdir -p _site
          cp -r docs demo dist README.md _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./docs/">
            <title>Barefoot CSS</title>
          </head>
          <body>
            <p>Barefoot CSS — <a href="./docs/">open the docs</a>.</p>
          </body>
          </html>
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
